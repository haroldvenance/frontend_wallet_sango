# Configuration Netlify — Sango Wallet (frontend_wallet_sango)
#
# Base directory : racine du repo (pnpm workspace — tous les packages
# sont dans packages/, l'app dans apps/wallet).
#
# Build :
#   1. Netlify installe pnpm depuis package.json (`packageManager`)
#   2. `pnpm install --frozen-lockfile` à la racine (workspace complet)
#   3. `pnpm --filter wallet build` (build l'app uniquement)
#   4. Le build produit `apps/wallet/dist/` qui est publié.
#
# Le contexte SPA (BrowserRouter) impose un fallback sur `/index.html`
# pour toutes les routes non-fichier.

[build]
  # Commande exécutée depuis la racine (base vide = root)
  command = "pnpm --filter wallet build"
  # Dossier publié, relatif à la racine
  publish = "apps/wallet/dist"

  # Environnement de build
  environment = { NODE_VERSION = "20", PNPM_VERSION = "9" }

# Redirection SPA : toutes les routes inconnues → index.html
# (nécessaire pour react-router BrowserRouter)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# En-têtes de sécurité (optionnel mais recommandé)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache des assets statiques (Vite ajoute un hash dans le nom)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Ne pas cacher index.html (doit toujours être rechargé)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
